<meta name="linx-theme" content="auto"><meta name="color-scheme" content="light dark"><meta name="theme-color" content="#f5f6fa">
<script>
let appearanceMode=document.querySelector('meta[name="linx-theme"]').content;
function resolvedAppearance(mode,now=new Date()){return mode==='auto'?(now.getHours()>=7&&now.getHours()<19?'light':'dark'):mode}
function applyAppearance(mode,now=new Date()){
  const theme=resolvedAppearance(mode,now);document.documentElement.dataset.theme=theme;document.documentElement.dataset.themeMode=mode;
  document.querySelector('meta[name="theme-color"]').content=theme==='dark'?'#131e30':'#f5f6fa';
  const toggle=document.getElementById('theme-toggle');if(toggle){
    const label=theme==='dark'?'切换到日间模式':'切换到夜间模式';toggle.title=label;toggle.setAttribute('aria-label',label);
    document.getElementById('theme-auto').setAttribute('aria-pressed',String(mode==='auto'));
  }
  const symbol=document.getElementById('theme-symbol');if(symbol){
    const shape=theme==='dark'?'<path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/>':'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/>';
    symbol.innerHTML='<svg viewBox="0 0 24 24">'+shape+'</svg>';
  }
  return theme;
}
let effectiveAppearance=applyAppearance(appearanceMode);
</script>

 .workspace-breadcrumb{gap:11px;flex:1 1 100%}.header-page-icon{width:36px;height:36px;border-radius:11px}

<script>
document.title='LinX · 远程模型管理';
'use strict';
const $=s=>document.querySelector(s), E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), I=n=>'<svg aria-hidden="true"><use href="#'+n+'"/></svg>';
const token=location.hash.slice(1)||sessionStorage.getItem('kit-token')||'';if(token)sessionStorage.setItem('kit-token',token);history.replaceState(null,'','/');
const S={page:'providers',settings:null,profiles:[],active:null,matches:false,runtimeMatches:false,runtime:null,loaded:false,error:'',tunnel:null,health:null,logs:[],draft:null,models:[],stage:1,busy:false,connected:false};
const labels={providers:'供应商配置',tunnel:'本机 Sub2API',connection:'服务器连接',help:'迁移与帮助'};
function clearToast(){clearTimeout(toast.timer);$('#toasthost').innerHTML=''}
function toast(text,error=false){clearToast();$('#toasthost').innerHTML='<div class="toast '+(error?'error':'')+'" role="'+(error?'alert':'status')+'">'+I(error?'info':'check')+'<span class="toast-message">'+E(String(text))+'</span><button class="toast-close" aria-label="关闭提示">'+I('close')+'</button></div>';$('#toasthost button').onclick=clearToast;if(!error)toast.timer=setTimeout(clearToast,5000)}
async function api(op,args={}){const r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json','X-Kit-Token':token},body:JSON.stringify({op,...args})});if(!r.ok)throw Error('界面连接已失效，请重新打开管理器');const v=await r.json();if(!v.ok)throw Error(v.error||'操作未完成');return v.data}

const themeToggle=document.getElementById('theme-toggle'),themeAuto=document.getElementById('theme-auto');
effectiveAppearance=applyAppearance(appearanceMode);
async function chooseAppearance(next){
  if(themeToggle.disabled)return;
  const previous=appearanceMode;themeToggle.disabled=themeAuto.disabled=true;
  appearanceMode=next;effectiveAppearance=applyAppearance(next);
  try{await api('appearance',{mode:next})}
  catch(e){appearanceMode=previous;effectiveAppearance=applyAppearance(previous);toast('外观设置未能保存：'+e.message,true)}
  finally{themeToggle.disabled=themeAuto.disabled=false}
}
themeToggle.addEventListener('click',()=>chooseAppearance(effectiveAppearance==='dark'?'light':'dark'));
themeAuto.addEventListener('click',()=>chooseAppearance('auto'));
function refreshAppearance(){
  const previous=effectiveAppearance;effectiveAppearance=applyAppearance(appearanceMode);
  if(effectiveAppearance!==previous)api('appearance_sync').catch(()=>{});
}
setInterval(refreshAppearance,30000);window.addEventListener('focus',refreshAppearance);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshAppearance()});

function toolVersion(value){const raw=String(value||'');return raw.match(/(?:codex-cli\s+|GNU Awk\s+)?(\d+\.\d+(?:\.\d+)?)/)?.[1]||raw||'未检测到'}
function toolUpdateProgress(name){
 const j=S.environment;if(!j||j.state==='idle'||(j.tool||j.result?.tool)!==name)return '';
 const latest=j.events?.at(-1)?.message||'正在连接服务器…';
 return '<div class="tool-update-progress" data-tool-progress="'+E(name)+'" aria-live="polite">'+environmentProgress(j)+'<p class="tool-update-message '+(j.state==='failed'?'error':'')+'">'+I(j.state==='done'?'check':'info')+'<span>'+E(j.state==='failed'?j.error:j.state==='done'?'更新完成，可继续使用':latest)+'</span></p>'+(j.events?.length?'<details class="environment-log"><summary>查看更新记录</summary><ol>'+j.events.map(e=>'<li>'+E(e.message)+'</li>').join('')+'</ol></details>':'')+'</div>';
}
function updatesView(){
 const j=S.updates;
 if(!j||j.state==='idle')return '<div class="update-empty">'+I('info')+'<div><strong>让服务器工具保持就绪</strong><p>检查可用版本，由你决定何时安装。</p></div></div>';

function environmentProgress(j){
 const e=j.events||[],last=e.at(-1)||{},download=[...e].reverse().find(x=>x.downloaded_bytes!==undefined),done=j.state==='done',failed=j.state==='failed';
 const phases=['check','download','verify','install','done'],names=['检查','下载','校验','安装','完成'],phase=done?'done':last.phase||'check',step=phases.indexOf(phase);
 const total=download?.total_bytes||0,bytes=download?.downloaded_bytes||0,percent=total?Math.min(100,Math.floor(bytes/total*100)):null;
 const value=done?100:percent,determinate=done||(phase==='download'&&percent!==null)||failed&&percent!==null;
 const mb=n=>(n/1048576).toFixed(1)+' MB';
 return '<section class="env-progress '+(failed?'failed':'')+'" aria-label="安装与更新进度"><div class="env-progress-title"><strong>'+(done?(j.tool?'更新完成':'准备完成'):failed?'任务已暂停，可重试继续':phase==='download'?(last.transfer?'正在传输到服务器':'正在下载'):phase==='verify'?'正在校验':phase==='install'?'正在安装':'正在检查')+'</strong><span>'+(done?'100%':percent!==null&&(phase==='download'||failed)?percent+'%':'处理中')+'</span></div><div class="env-progress-track '+(!determinate&&!failed?'indeterminate':'')+'" role="progressbar" aria-label="安装与更新进度" aria-valuemin="0" aria-valuemax="100" '+(determinate?'aria-valuenow="'+value+'"':'')+'><i style="width:'+(determinate?value:failed?0:35)+'%"></i></div>'+(download?'<p class="env-download-size">'+(download.transfer?'已传输 ':'已下载 ')+mb(bytes)+(total?' / '+mb(total):'')+(failed?' · 缓存已保留':'')+'</p>':'')+'<ol class="env-phase-steps">'+names.map((name,i)=>'<li class="'+(i===step?'current':i<step?'passed':'')+'"><span>'+(i<step?'✓':i+1)+'</span>'+name+'</li>').join('')+'</ol></section>';
}

function bindPage(){bindUpdateButtons();if($('#updates-check'))$('#updates-check').onclick=()=>checkUpdates(true);if($('#environment-start'))$('#environment-start').onclick=()=>prepareEnvironment();if($('#sync-catalog'))$('#sync-catalog').onclick=()=>syncNativeCatalog();document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>navigate(b.dataset.goto));['add','addcard'].forEach(id=>{if($('#'+id))$('#'+id).onclick=()=>openWizard()});['retry','refresh'].forEach(id=>{if($('#'+id))$('#'+id).onclick=refresh});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openWizard(S.profiles.find(p=>p.id===b.dataset.edit)));document.querySelectorAll('[data-test]').forEach(b=>b.onclick=()=>testProfile(b.dataset.test));document.querySelectorAll('[data-use]').forEach(b=>b.onclick=()=>activate(b.dataset.use));if($('#starttunnel')){$('#starttunnel').onclick=startTunnel;$('#checktunnel').onclick=checkTunnel;$('#stoptunnel').onclick=stopTunnel}if($('#savesettings')){bindCindyHosts();$('#cindy-host-refresh').onclick=()=>refreshCindyConnections(true);document.querySelectorAll('[name=sshmode]').forEach(i=>i.onchange=sshMode);sshMode();$('#savesettings').onclick=saveSettings;$('#sshlogin').onclick=async()=>{try{const d=await task('打开 SSH 登录',()=>api('ssh_login',{settings:connectionDraft()}));toast(d.message)}catch(e){toast(e.message,true)}}}if($('#export'))$('#export').onclick=exportZip;if($('#rollback'))$('#rollback').onclick=rollback}
function navigate(page){S.page=page;render();if(page==='connection')refreshCindyConnections();if(page==='tunnel'&&S.health===null&&!S.busy)checkTunnel(false)}
function preferredConnectionMode(){const s=S.settings||{};if(s.connection_source==='cindy')return 'cindy';if(s.connection_source==='manual')return s.host?'host':'alias';return s.host?'host':'cindy'}
function cindyHostList(){const d=S.cindyConnections||{hosts:[],warnings:[]},selected=S.cindySelection||S.settings?.cindy_host||S.settings?.alias;return (d.hosts.length?'<div class="cindy-host-options">'+d.hosts.map(h=>'<label class="cindy-host-option"><input type="radio" name="cindyhost" value="'+E(h.id)+'" '+(h.id===selected?'checked':'')+'><span class="cindy-host-copy"><b>'+E(h.name)+'</b><small>'+E((h.user?h.user+'@':'')+h.hostname+':'+h.port)+'</small><small>'+E(h.id)+(h.jump?' · 通过跳板 / 代理':'')+'</small></span><span class="badge">'+(h.managed_by_cindy?'Cindy':'SSH 配置')+'</span></label>').join('')+'</div>':'<div class="empty cindy-empty"><h3>暂未读取到服务器</h3><p>请先在 Cindy → 设置 → 远程连接添加服务器，再点“刷新列表”；也可以选择手动添加。</p></div>')+(d.warnings||[]).map(w=>'<p class="model-menu-note">'+E(w)+'</p>').join('')}
function bindCindyHosts(){document.querySelectorAll('[name=cindyhost]').forEach(i=>i.onchange=()=>{S.cindySelection=i.value})}
async function refreshCindyConnections(notify=false){try{const d=await api('cindy_connections');if(JSON.stringify(d)!==JSON.stringify(S.cindyConnections)){S.cindyConnections=d;if($('#cindy-host-list')){$('#cindy-host-list').innerHTML=cindyHostList();bindCindyHosts()}}if(notify)toast('已刷新 Cindy 服务器列表')}catch(e){if(notify)toast(e.message,true)}}
function sshMode(){const mode=$('[name=sshmode]:checked').value;$('#aliasfield').classList.toggle('hidden',mode!=='alias');$('#hostfields').classList.toggle('hidden',mode!=='host');$('#cindy-host-section').classList.toggle('hidden',mode!=='cindy')}
function connectionDraft(){const settings={...S.settings};document.querySelectorAll('[data-setting]').forEach(i=>settings[i.dataset.setting]=i.value.trim());const mode=$('[name=sshmode]:checked').value;settings.connection_source=mode==='cindy'?'cindy':'manual';settings.cindy_host=mode==='cindy'?($('[name=cindyhost]:checked')?.value||''):'';if(mode==='cindy'){if(!settings.cindy_host)throw Error('请先选择一台 Cindy 服务器');settings.alias=settings.cindy_host;settings.host='';settings.identity=''}else if(mode==='alias')settings.host='';return settings}
async function saveSettings(){try{const settings=connectionDraft();await task('连接所选服务器',async()=>{const d=await api('settings',{settings});S.settings=d.settings;S.environment=null;S.updates=null;await loadProfiles()});S.page='providers';render();toast('连接成功，已读取你的供应商配置')}catch(e){toast(e.message,true)}}
function closeTest(){if(S.busy)return;S.testDialog=null;$('#testhost').innerHTML='';if(!S.draft)document.body.classList.remove('modal-open')}
function testProfile(id){
 if(S.busy)return;
 const p=S.profiles.find(p=>p.id===id)||(S.draft?.id===id?S.draft:null);
 if(!p)return toast('配置尚未读取，请刷新后重试',true);
 const models=[...new Set(p.selected_models?.length?p.selected_models:[p.model].filter(Boolean))];
 if(!models.length)return toast('请先为这个供应商保存要使用的模型',true);
 S.testDialog={id,live:id===S.active&&S.runtimeMatches,models};
 document.body.classList.add('modal-open');
 $('#testhost').innerHTML='<div class="overlay test-overlay"><section class="modal test-modal" role="dialog" aria-modal="true" aria-labelledby="test-heading"><div class="modalhead"><h2 id="test-heading">测试连接</h2><button class="subtle op" id="test-close" aria-label="关闭测试窗口">'+I('close')+'</button></div><div class="modalbody"><div class="test-provider"><span class="serviceicon">'+I(p.mode==='tunnel'?'link':'server')+'</span><div><strong>'+E(p.name)+'</strong><small>'+E(p.base_url)+'</small></div></div><h3 class="test-section-title">选择一个模型</h3><p class="wizard-note">每次仅测试下方选中的模型，不会逐个测试其他模型，也不会更改已启用的配置。</p><div class="test-models" role="radiogroup" aria-label="选择测试模型">'+models.map((m,i)=>'<label class="test-model-option"><input type="radio" name="test-model" value="'+E(m)+'" '+(i===0?'checked':'')+'><span title="'+E(m)+'">'+E(m)+'</span></label>').join('')+'</div><p class="test-hint">'+(S.testDialog.live?'将通过当前远程 Codex 的实际路由进行测试。':'将独立测试此供应商，当前对话的路由保持不变。')+'测试会产生少量模型用量。</p><div id="test-result" role="status" aria-live="polite"></div><div class="modalfooter"><button class="subtle op" id="test-cancel">取消</button><button class="primary op" id="test-run">测试所选模型</button></div></div></section></div>';
 $('#test-close').onclick=$('#test-cancel').onclick=closeTest;$('#test-run').onclick=runSelectedTest;
 $('#testhost').querySelectorAll('input').forEach(input=>input.onchange=()=>{$('#test-result').className='';$('#test-result').textContent='';$('#test-run').textContent='测试所选模型'});
 $('#testhost input:checked').focus();
}
async function runSelectedTest(){
 const state=S.testDialog,model=$('#testhost input[name="test-model"]:checked')?.value;
 if(!state||S.busy)return;if(!model)return toast('请选择一个模型',true);
 const result=$('#test-result');result.className='test-result pending';result.textContent='正在测试 '+model+'…';
 $('#testhost').querySelectorAll('input').forEach(e=>e.disabled=true);
 try{
   const r=await task('测试模型 · '+model,()=>api(state.live?'test_active':'test',{id:state.id,model}));
   result.className='test-result success';result.textContent='连接成功 · '+r.model+(state.live?' · 当前远程路由已验证':' · 独立配置测试通过');toast(result.textContent);
 }catch(e){result.className='test-result error';result.textContent='测试未通过 · '+model+'：'+e.message;toast(result.textContent,true)}
 finally{$('#testhost').querySelectorAll('input').forEach(e=>e.disabled=false);$('#test-run').textContent='再次测试所选模型';$('#test-cancel').textContent='完成'}
}

async function activate(id){try{const r=await task('切换供应商并刷新远程 Codex 服务',async()=>{return applyOperationState(await api('activate',{id}))});render();toast(r.note)}catch(e){toast(e.message,true)}}
async function checkTunnel(notify=true){try{await task('检查服务器能否访问本机服务',async()=>{const d=await api('tunnel_check');S.tunnel=d.local;S.health=true});if(notify)toast('隧道与本机 Sub2API 均已连通')}catch(e){S.health=false;if(notify)toast(e.message,true)}if(S.page==='tunnel')render()}
async function startTunnel(){try{await task('建立后台隧道',()=>api('tunnel_start'));await checkTunnel()}catch(e){toast(e.message,true)}}
async function stopTunnel(){try{await task('停止本工具管理的隧道',()=>api('tunnel_stop'));S.health=null;render();toast('已停止本工具的隧道；其他 SSH 连接不受影响。')}catch(e){toast(e.message,true)}}
async function rollback(){if(!confirm('回退上一次切换，并在服务器空闲时刷新 Codex？'))return;try{await task('回退上次切换',async()=>{await api('rollback');await loadProfiles()});render();toast('已回退并刷新远程服务。')}catch(e){toast(e.message,true)}}
async function exportZip(){try{const r=await task('生成不含密钥的迁移包',()=>api('export'));const bytes=Uint8Array.from(atob(r.archive),c=>c.charCodeAt(0)),url=URL.createObjectURL(new Blob([bytes],{type:'application/zip'})),a=document.createElement('a');a.href=url;a.download=r.filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);toast('迁移包已开始下载，不含 API Key 和 SSH 私钥。')}catch(e){toast(e.message,true)}}
function openWizard(p){S.draft=p?{...p,key:'',existing:true}:{id:'provider_'+crypto.randomUUID().replaceAll('-','').slice(0,8),name:'',mode:'direct',base_url:'',model:'',key:'',existing:false};S.draft.selected_models=[...(p?.selected_models||(p?.model?[p.model]:[]))];S.models=[];S.stage=1;document.body.classList.add('modal-open');drawWizard()}
function closeWizard(){if(S.busy)return;if(S.draft)S.draft.key='';S.draft=null;$('#modalhost').innerHTML='';document.body.classList.remove('modal-open')}
function drawWizard(){const p=S.draft;if(!p)return;let body='<div class="wizardsteps">'+['连接服务','选择模型','保存完成'].map((x,i)=>'<span class="'+(S.stage>=i+1?'on':'')+'"><i>'+(i+1)+'</i>'+x+'</span>').join('')+'</div>';if(S.stage===1){body+='<div class="eyebrow">选择连接方式</div><div class="choice"><label><input type="radio" name="providermode" value="direct" '+(p.mode==='direct'?'checked':'')+'>直连中转站<small>服务器直接调用，无需本机在线</small></label><label><input type="radio" name="providermode" value="tunnel" '+(p.mode==='tunnel'?'checked':'')+'>本机 Sub2API<small>通过隧道使用这台电脑的服务</small></label></div><div class="field"><label>接口地址</label><input id="w-url" value="'+E(p.base_url)+'" placeholder="https://example.com/v1"><small id="urlhint">使用中转站提供的 API 根地址，通常以 /v1 结尾。</small></div><div class="field"><label>API Key'+(p.existing?' <span class="badge good">服务器已保存</span>':'')+'</label><div class="pillkey"><input id="w-key" type="password" autocomplete="off" value="'+E(p.key)+'" placeholder="'+(p.existing?'留空即可继续使用原来的 Key':'粘贴这个服务的 API Key')+'"><button id="showkey">显示</button></div><small>Key 经 SSH 保存到服务器，不会放进迁移包。</small></div><div class="field"><label>配置名称 <span class="muted">· 可选</span></label><input id="w-name" value="'+E(p.name)+'" placeholder="例如 我的中转站；留空自动命名"></div><div id="w-error"></div><div class="modalfooter"><button class="subtle" id="w-cancel">取消</button><div class="actions"><button class="subtle op" id="w-manual">手动填写模型</button><button class="primary op" id="w-next">获取模型，继续 →</button></div></div>' }else if(S.stage===2){const selected=p.selected_models||[];const all=[...new Set([...S.models,...selected])];body+='<h3 class="wizard-title">勾选要使用的模型</h3><p class="wizard-note">支持 GPT、DeepSeek 等服务提供的准确模型 ID，无需在推荐列表里。启用后同步到 Cindy 菜单；内部审核模型会被 Cindy 隐藏。实际调用需接口支持 Responses；非内置模型会自动启用标准函数工具兼容。</p><div class="model-toolbar"><input id="model-search" aria-label="搜索模型" placeholder="搜索模型"><button id="models-all">全选结果</button><button id="models-none">清空</button></div><p id="model-count" class="model-count"></p><div id="model-visibility"></div><div id="model-options" class="model-options">'+all.map(m=>'<label data-model-row class="model-option"><input type="checkbox" data-model="'+E(m)+'" '+(selected.includes(m)?'checked':'')+'><span>'+E(m)+'</span></label>').join('')+'</div><div class="model-manual"><input id="model-manual" aria-label="手动添加模型" placeholder="输入准确模型 ID"><button id="model-add">添加模型</button></div><div id="w-error"></div><div class="modalfooter"><button class="subtle" id="w-back">← 上一步</button><button class="primary op" id="w-save">保存所选模型 →</button></div>' }else{body+='<div class="wizard-success"><div class="successicon">'+I('check')+'</div><h3>'+ (p.autoApplied?(p.syncPending?'已保存，等待远程服务启动':'已保存并同步'):'配置已保存')+'</h3><p>'+(p.autoApplied?(p.syncPending?'配置已更新，远程 Codex 服务启动后会加载新的模型目录。':'当前供应商的修改已应用，所选模型已同步到 Cindy，无需再次启用。'):'仅保存配置，当前使用的供应商保持不变。需要切换时，请在供应商列表点击“启用”。')+'</p></div><div class="summary"><div class="summary-row"><span class="summary-label">供应商</span><div class="summary-value">'+E(p.name)+'</div></div><div class="summary-row"><span class="summary-label">已选模型<br>'+p.selected_models.length+' 个</span>'+modelTags(p.selected_models,12)+'</div></div>'+modelMenuNote(p.selected_models)+notice('启用无需先测试，不会发送测试请求。工具会在远程任务空闲时刷新 Codex 并恢复旧对话；可选的连接测试会产生少量用量。')+'<div id="w-error"></div><div class="modalfooter"><button class="subtle op" id="w-test">测试连接</button><div class="wizardoptional"><button class="op" id="w-enable">启用此供应商 '+I('check')+'</button><button class="primary" id="w-done">完成，返回列表</button></div></div>'}$('#modalhost').innerHTML='<div class="overlay"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="wizard-heading"><div class="modalhead"><h2 id="wizard-heading">'+(p.existing?'编辑供应商':'添加供应商')+'</h2><button class="subtle" id="w-close" aria-label="关闭">'+I('close')+'</button></div><div class="modalbody">'+body+'</div></section></div>';$('#w-close').onclick=closeWizard;if(S.stage===1){$('#w-cancel').onclick=closeWizard;$('#showkey').onclick=()=>{const i=$('#w-key');i.type=i.type==='password'?'text':'password';$('#showkey').textContent=i.type==='password'?'显示':'隐藏'};document.querySelectorAll('[name=providermode]').forEach(i=>i.onchange=wizardMode);wizardMode();$('#w-next').onclick=wizardNext;$('#w-manual').onclick=()=>{try{readWizard();S.stage=2;drawWizard()}catch(e){wizardError(e.message)}}}else if(S.stage===2){$('#w-back').onclick=()=>{readModelSelection();S.stage=1;drawWizard()};$('#w-save').onclick=wizardSave;bindModels()}else{$('#w-done').onclick=closeWizard;$('#w-enable').onclick=wizardEnable;$('#w-enable').style.display=p.autoApplied?'none':'';$('#w-test').onclick=()=>testProfile(S.draft.id)}}
function readModelSelection(){const p=S.draft;p.selected_models=[...document.querySelectorAll('[data-model]:checked')].map(x=>x.dataset.model);if(!p.selected_models.includes(p.model))p.model=p.selected_models[0]||''}
function bindModels(){const boxes=()=>[...document.querySelectorAll('[data-model]')];const count=()=>{const ids=boxes().filter(x=>x.checked).map(x=>x.dataset.model);$('#model-count').textContent='已选 '+ids.length+' 个 / 共 '+boxes().length+' 个模型 · Cindy 菜单可选 '+menuModels(ids).length+' 个';$('#model-visibility').innerHTML=modelMenuNote(ids)};boxes().forEach(x=>x.onchange=count);$('#model-search').oninput=()=>{const q=$('#model-search').value.toLowerCase();boxes().forEach(x=>x.closest('label').style.display=x.dataset.model.toLowerCase().includes(q)?'flex':'none')};$('#models-all').onclick=()=>{boxes().filter(x=>x.closest('label').style.display!=='none').forEach(x=>x.checked=true);count()};$('#models-none').onclick=()=>{boxes().forEach(x=>x.checked=false);count()};$('#model-add').onclick=()=>{const id=$('#model-manual').value.trim();if(!id)return;readModelSelection();if(!S.draft.selected_models.includes(id))S.draft.selected_models.push(id);drawWizard()};$('#model-manual').onkeydown=e=>{if(e.key==='Enter')$('#model-add').click()};count()}
let polling=false;async function autoRefresh(){if(polling||S.busy||S.draft||S.page==='connection'||document.hidden||!S.settings)return;polling=true;try{const before=JSON.stringify([S.profiles,S.active,S.matches,S.runtimeMatches,S.error,S.catalog]);await loadProfiles();if(before!==JSON.stringify([S.profiles,S.active,S.matches,S.runtimeMatches,S.error,S.catalog]))render()}catch(e){connected(false)}finally{polling=false;maybeSyncCatalog()}}
let reopenVersion=null;setInterval(async()=>{try{const r=await api('ping');if(reopenVersion!==null&&r.reopen!==reopenVersion)autoRefresh();reopenVersion=r.reopen}catch{}},2000);
setInterval(()=>{if(!document.hidden)checkUpdates()},6*60*60*1000);setInterval(()=>{if(S.page==='connection'&&!document.hidden)refreshCindyConnections()},15000);setInterval(autoRefresh,15000);window.addEventListener('focus',autoRefresh);document.addEventListener('visibilitychange',()=>{if(!document.hidden)autoRefresh()});
function wizardError(text){toast(text,true)}
function wizardMode(){const isTunnel=$('[name=providermode]:checked').value==='tunnel';if(isTunnel){$('#w-url').value='http://127.0.0.1:'+(S.settings?.remote_port||18765)+'/v1'}else if($('#w-url').readOnly){$('#w-url').value=S.draft.mode==='direct'?S.draft.base_url:''}$('#w-url').readOnly=isTunnel;$('#urlhint').textContent=isTunnel?'这是服务器上的隧道地址，请先在“本机 Sub2API”连接服务。':'使用中转站提供的 API 根地址，通常以 /v1 结尾。'}
function readWizard(){const p=S.draft;p.mode=$('[name=providermode]:checked').value;p.base_url=$('#w-url').value.trim().replace(/\/$/,'');p.key=$('#w-key').value.trim();p.name=$('#w-name').value.trim();if(!p.base_url)throw Error('请先填写中转站的接口地址');let u;try{u=new URL(p.base_url)}catch{throw Error('接口地址格式不正确，请以 https:// 或 http:// 开头')}if(!['http:','https:'].includes(u.protocol))throw Error('接口地址需要以 https:// 或 http:// 开头');if(!p.key&&!p.existing)throw Error('请粘贴这个服务的 API Key');if(!p.name)p.name=p.mode==='tunnel'?'本机 Sub2API':u.hostname}
async function wizardNext(){try{readWizard();const r=await task('从服务器获取可用模型',()=>api('models',{profile:S.draft}));S.models=r.models;S.stage=2;drawWizard()}catch(e){wizardError(e.message)}}
async function wizardSave(){const p=S.draft;readModelSelection();if(!p.selected_models.length)return wizardError('请至少勾选或添加一个模型');try{const r=await task(p.id===S.active?'保存并同步当前供应商':'保存供应商配置',async()=>{const r=await api('save',{profile:p});p.key='';return applyOperationState(r)});p.autoApplied=r.auto_applied===true;p.syncPending=p.autoApplied&&S.catalog?.status!=='synced';p.existing=true;S.stage=3;render();drawWizard();$('#w-done').focus();toast(r.note||'供应商已保存，当前供应商保持不变')}catch(e){wizardError(e.message)}}
async function wizardEnable(){try{const r=await task('启用供应商并刷新远程配置',async()=>{return applyOperationState(await api('activate',{id:S.draft.id}))});closeWizard();render();toast(r.note)}catch(e){wizardError(e.message)}}
$('#header-connection').onclick=()=>navigate('connection');
$('#logs').onclick=()=>{const show=()=>{$('#drawerhost').innerHTML='<aside class="drawer"><div class="row"><h2>操作记录</h2><button class="subtle" id="closelogs">'+I('close')+'</button></div><p class="muted">仅记录本次打开界面的操作，不显示 API Key。</p>'+(S.logs.length?S.logs.map(x=>'<div class="logitem"><time>'+E(x.at)+'</time>'+E(x.label)+(x.error?'<pre>'+E(x.error)+'</pre>':' <span style="color:var(--good)">完成</span>')+'</div>').join(''):'<p class="muted">暂无操作记录</p>')+'</aside>';$('#closelogs').onclick=()=>$('#drawerhost').innerHTML=''};show()};
$('#server-settings').onclick=()=>navigate('connection');
$('#quit').onclick=async()=>{if(S.busy)return toast('请等待当前操作完成');try{await api('quit');document.body.innerHTML='<div class="empty quit-screen"><h3>管理界面已退出</h3><p class="muted">后台隧道继续运行。你可以关闭这个窗口。</p></div>';window.close()}catch(e){toast(e.message,true)}};
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>navigate(b.dataset.page));document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(S.testDialog)closeTest();else closeWizard()}});
(async()=>{render();try{const d=await api('bootstrap');S.settings=d.settings;S.cindyConnections=d.cindy_connections||{hosts:[],warnings:[]};S.tunnel=d.tunnel;S.environment=d.environment;if(!(S.settings.host||S.settings.alias||S.settings.cindy_host)){S.page='connection';S.loaded=true;connected(false);render();return}render();await refresh();if(S.environment?.state==='running')prepareEnvironment(true);checkUpdates()}catch(e){S.loaded=true;S.error=e.message;connected(false);render()}})();
</script></body></html>
