name: Release packages
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install PyInstaller==6.22.3
      - run: python -m unittest discover -s tests -v
      - run: python tools/audit_public.py
      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/')
        shell: python
        run: |
          import os
          from pathlib import Path
          assert os.environ['GITHUB_REF_NAME'] == 'v' + Path('VERSION').read_text().strip()
      - run: python tools/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: LinX-Remote-public-packages
          path: dist/*
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME dist/* --verify-tag --title "LinX Remote $env:GITHUB_REF_NAME" --notes-file CHANGELOG.md
