name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.8', '3.13']
        exclude:
          - os: macos-latest
            python: '3.8'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m compileall -q manager.py remote_manager.py remote_environment.py download_bridge.py cindy_connections.py web_app.py launch.pyw tools tests
      - run: python -m unittest discover -s tests -v
      - run: python tools/audit_public.py
      - run: python tools/build_release.py --source-only
