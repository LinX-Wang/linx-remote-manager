name: "故障反馈 / Bug report"
description: "程序报错、连接失败、模型不同步或界面显示异常。English answers are welcome."
title: "[故障] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！填写关键情况，方便我们定位问题。

        **提交内容会公开显示。** 请遮盖服务器地址、用户名、API Key、认证头和其他个人信息，不要上传私钥、个人迁移包或完整配置。
        安全漏洞请改用 [私密报告](https://github.com/LinX-Wang/linx-remote-manager/security/advisories/new)。You may fill in this form in English.
  - type: input
    id: version
    attributes:
      label: "管理器版本 / Version"
      description: "填写下载包的版本号；源码运行可填写 commit。不确定时请写“不确定”。"
      placeholder: "例如 v1.7.6 / source commit"
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: "本机操作系统 / Operating system"
      options:
        - Windows
        - macOS
        - Linux
        - 其他 / Other
    validations:
      required: true
  - type: input
    id: system-details
    attributes:
      label: "系统和运行方式 / System details"
      description: "可填写系统版本、芯片架构，以及 EXE、Mac 启动器或 Python 源码运行。"
      placeholder: "例如 Windows 11 + EXE；macOS + Apple Silicon + Python 3.13"
  - type: dropdown
    id: area
    attributes:
      label: "问题发生在哪里？ / Affected area"
      options:
        - 启动或窗口 / Launch or window
        - SSH 服务器连接 / Server connection
        - 本机 Sub2API 隧道 / Local Sub2API tunnel
        - 供应商配置或切换 / Provider configuration
        - 获取模型或菜单同步 / Models or menu synchronization
        - gawk、Codex 安装或更新 / Tool installation or update
        - 界面显示或主题 / Layout or theme
        - 其他 / Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: "问题描述 / What happened?"
      description: "说明发生了什么，以及你原本希望看到什么结果。"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: "复现步骤 / Steps to reproduce"
      description: "从哪个页面开始、点击了什么、哪一步出现问题？偶发问题可注明。"
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: "截图和错误信息（可选） / Screenshots and errors"
      description: "可粘贴脱敏错误文字，或拖入已遮盖个人信息的截图。请不要上传完整日志或个人配置。"
  - type: checkboxes
    id: privacy
    attributes:
      label: "提交前确认 / Before submitting"
      options:
        - label: "我已检查文字和附件，不含密码、API Key、SSH 私钥、认证头或其他敏感个人信息。"
          required: true
