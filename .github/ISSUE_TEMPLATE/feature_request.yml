name: "功能建议 / Feature request"
description: "建议新功能、改进操作流程或优化界面。English answers are welcome."
title: "[建议] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        说说你想改善什么，我们会结合实际使用场景评估。

        **建议和附件会公开显示。** 请勿提供真实服务器信息、账号凭据、个人配置或迁移包。You may fill in this form in English.
  - type: textarea
    id: scenario
    attributes:
      label: "使用场景 / Use case"
      description: "你在做什么？现在遇到什么不便？"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: "希望怎样改进？ / Proposed improvement"
      description: "描述你希望看到的行为、页面或操作方式；也可以附脱敏示意图。"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "替代办法或参考（可选） / Alternatives or references"
      description: "现在如何处理？有可参考的公开链接或设计吗？"
  - type: checkboxes
    id: privacy
    attributes:
      label: "提交前确认 / Before submitting"
      options:
        - label: "我已检查文字和附件，不含密码、API Key、SSH 私钥或其他敏感个人信息。"
          required: true
